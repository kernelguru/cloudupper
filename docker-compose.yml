services:
  cloudupper:
    build: .
    image: cloudupper:latest
    container_name: cloudupper
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      # Benutzer/Gruppe, denen deine Dateien gehören (`id` auf dem Host; Unraid: 99/100)
      - PUID=1000
      - PGID=1000
    volumes:
      - ./config:/config            # rclone.conf, Einstellungen, Auftragsliste
      - /pfad/zu/deinen/dateien:/data   # Diese Dateien kannst du hochladen; TorBox-Downloads landen in /data/downloads
