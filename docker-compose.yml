services:
  cloudupper:
    image: ghcr.io/kernelguru/cloudupper:latest
    # Alternativ lokal bauen:
    # build: .
    container_name: cloudupper
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Nur für das optionale VPN (VPN_ENABLED=true) nötig:
    cap_add:
      - NET_ADMIN
    env_file: .env
    environment:
      # Benutzer/Gruppe für neue Dateien (`id` auf dem Host; Unraid: 99/100)
      - PUID=99
      - PGID=100
      - UMASK=000
    volumes:
      - ./config:/config                 # rclone.conf, Einstellungen, Auftragsliste
      - /pfad/zu/deinen/dateien:/data    # TorBox-Downloads landen in /data/downloads
