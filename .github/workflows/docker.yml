name: Docker-Image bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "unraid/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Python-Syntax prüfen
        run: python3 -m compileall -q app

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Tags & Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

      - name: Testbuild (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cloudupper:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-Test
        run: |
          docker run -d --name cu -p 8080:8080 -e APP_PASSWORD=test cloudupper:test
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/api/session && break
            sleep 1
          done
          curl -fs http://localhost:8080/api/session | grep -q '"auth_required":true'
          curl -fs http://localhost:8080/ | grep -q CloudUpper
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/remotes)" = 401
          docker exec cu rclone version
          # VPN-Skript im Trockenlauf (prüft Werkzeuge und Konfig-Verarbeitung im Image)
          docker exec cu sh -c 'mkdir -p /tmp/wg && printf "[Interface]\nprivatekey = AAAA\nAddress = 10.2.0.2/32, 2a07:b944::2:2/128\nDNS = 10.2.0.1\n\n[Peer]\nPublicKey = BBBB\nAllowedIPs = 0.0.0.0/0, ::/0\nEndpoint = 185.159.157.10:51820\n" > /tmp/wg/wg0.conf && DRY_RUN=1 WG_CONFIG=/tmp/wg/wg0.conf cloudupper-vpn up' | tee /tmp/vpn.txt
          grep -q "privatekey = \*\*\*" /tmp/vpn.txt
          grep -q "ip route replace 0.0.0.0/1 dev wg0" /tmp/vpn.txt
          grep -q "CONNMARK --set-mark" /tmp/vpn.txt
          docker exec cu sh -c 'DRY_RUN=1 cloudupper-vpn down' | tee /tmp/vpn-down.txt
          grep -q "iptables -D OUTPUT -j CU_VPN" /tmp/vpn-down.txt
          docker exec cu sh -c 'command -v cloudupper-vpnd'
          docker exec cu sh -c 'command -v wg && command -v ip && command -v iptables'
          docker logs cu

      - name: Bei GHCR anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen & veröffentlichen (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
